# docker stack deploy -c docs/swarm/stack-labels.yml caddy
#
# Generate the hash with `caddy hash-password` and write every `$` as `$$`.
# Labels go under deploy.labels, that is what caddy-docker-proxy reads in swarm.

services:
  caddy:
    image: your-registry/caddy:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_INGRESS_NETWORKS: caddy_web
      CADDYSCOPE_PASSWORD_HASH: "$$2a$$14$$hZKMKHEkwOyh3jCnJRNYVubBSCcZaMSw8VIeRn61HFe37nLGz/RAO"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        # global options
        caddy.email: ops@example.com
        caddy.metrics.per_host: ""
        # the dashboard site block
        caddy_0: scope.example.com
        caddy_0.caddyscope: /dashboard
        caddy_0.caddyscope.username: admin
        caddy_0.caddyscope.password: "{$$CADDYSCOPE_PASSWORD_HASH}"
        caddy_0.caddyscope.refresh: 5s

  app:
    image: traefik/whoami
    command: ["--port", "3000"]
    networks:
      - web
    deploy:
      labels:
        caddy: app.example.com
        caddy.reverse_proxy: "{{upstreams 3000}}"

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: overlay
